<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -150 280 300">
<!-- Ox Pellerin's face, drawn by Claude over tools/video/blender_view.py's front render (boss, centre 0 / 1.62 m, 3.5 px/mm).
     Units are millimetres, x to the viewer's right, y down, 0 at the origin below. tools/video/art_features.py projects it
     onto the mesh and bakes it into boss_ink.png; features_uv.svg is the result in the UV2 layout. Heavy lines on the shadow
     side, thin on the lit side, hatching on the jaw (ref 1 at 0.9 s), nothing symmetrical. -->
<g data-view="front" data-origin="0 1.62" data-px="5">
	<!-- the brow ridge: two heavy strokes that frown toward the nose, a lighter stroke over each -->
	<g stroke-width="2.6" opacity="0.95" data-taper="0.12,0.4" data-wobble="0.3">
		<path id="brow_l" d="M -50 -26 C -42 -33, -28 -35, -12 -28"/>
		<path id="brow_r" d="M 10 -28 C 22 -35, 38 -34, 52 -25"/>
	</g>
	<g stroke-width="1.1" opacity="0.6" data-taper="0.3,0.3" data-wobble="0.35">
		<path id="brow_l2" d="M -46 -34 C -38 -39, -28 -40, -18 -36"/>
		<path id="brow_r2" d="M 16 -36 C 26 -40, 38 -39, 46 -33"/>
		<path id="furrow_1" d="M -4 -38 C -5 -33, -5 -29, -4 -25"/>
		<path id="furrow_2" d="M 5 -38 C 6 -33, 5 -30, 4 -26"/>
	</g>
	<!-- the eyes: a heavy upper lid, a lighter lower lid, the lid's crease, the dark of the iris -->
	<g stroke-width="1.7" opacity="0.95" data-taper="0.1,0.3" data-wobble="0.2">
		<path id="lid_l" d="M -48 -17 C -42 -23, -30 -24, -18 -17"/>
		<path id="lid_r" d="M 14 -17 C 22 -24, 36 -24, 46 -18"/>
	</g>
	<g stroke-width="1.1" opacity="0.7" data-taper="0.3,0.3" data-wobble="0.2">
		<path id="low_l" d="M -43 -13 C -36 -10, -27 -10, -21 -13"/>
		<path id="low_r" d="M 18 -13 C 25 -10, 34 -10, 41 -13"/>
		<path id="crease_l" d="M -45 -27 C -37 -30, -28 -29, -21 -24"/>
		<path id="crease_r" d="M 17 -24 C 26 -29, 35 -30, 43 -26"/>
		<path id="bag_l" d="M -40 -6 C -34 -2, -27 -2, -22 -5"/>
		<path id="bag_r" d="M 19 -5 C 25 -2, 33 -2, 38 -6"/>
	</g>
	<path id="iris_l" fill="ink" fill-opacity="0.95" opacity="1" d="M -36 -19 C -33 -22, -28 -22, -26 -19 C -28 -15, -33 -15, -36 -19 Z"/>
	<path id="iris_r" fill="ink" fill-opacity="0.95" opacity="1" d="M 22 -19 C 25 -22, 30 -22, 32 -19 C 30 -15, 25 -15, 22 -19 Z"/>
	<path id="socket_l" fill="ink" fill-opacity="0.3" opacity="1" d="M -50 -24 C -40 -30, -28 -30, -16 -22 C -26 -18, -40 -16, -50 -17 Z"/>
	<path id="socket_r" fill="ink" fill-opacity="0.3" opacity="1" d="M 12 -23 C 24 -30, 38 -30, 50 -24 C 42 -17, 28 -17, 12 -20 Z"/>
	<!-- the nose: the two lines of the bridge, the wings, the nostrils, the shadow under the tip -->
	<g stroke-width="1.3" opacity="0.8" data-taper="0.25,0.25" data-wobble="0.3">
		<path id="bridge_l" d="M -9 -24 C -11 -12, -12 2, -17 14"/>
		<path id="bridge_r" d="M 8 -24 C 10 -12, 12 2, 17 14"/>
		<path id="wing_l" d="M -27 12 C -29 21, -20 29, -9 28"/>
		<path id="wing_r" d="M 26 12 C 28 21, 19 29, 8 28"/>
	</g>
