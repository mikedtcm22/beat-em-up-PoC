<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -150 280 300">
<!-- Ox Pellerin's face, drawn by Claude over tools/video/blender_view.py's front render (boss, centre 0 / 1.62 m, 3.5 px/mm).
     Units are millimetres, x to the viewer's right, y down, 0 at the origin below. tools/video/art_features.py projects it
     onto the mesh and bakes it into boss_ink.png; features_uv.svg is the result in the UV2 layout. Heavy lines on the shadow
     side, thin on the lit side, hatching on the jaw (ref 1 at 0.9 s), nothing symmetrical. -->
<g data-view="front" data-origin="0 1.62" data-px="5">
	<!-- the brow ridge: two heavy strokes that frown toward the nose, a lighter stroke over each -->
	<g stroke-width="2.6" opacity="0.95" data-taper="0.12,0.4" data-wobble="0.3">
		<path id="brow_l" d="M -50 -26 C -42 -33, -28 -35, -12 -28"/>
		<path id="brow_r" d="M 10 -28 C 22 -35, 38 -34, 52 -25"/>
	</g>
	<g stroke-width="1.1" opacity="0.6" data-taper="0.3,0.3" data-wobble="0.35">
		<path id="furrow_1" d="M -4 -38 C -5 -33, -5 -29, -4 -25"/>
	</g>
	<!-- the eyes: a heavy upper lid, a lighter lower lid, the lid's crease, the dark of the iris -->
	<g stroke-width="1.7" opacity="0.95" data-taper="0.1,0.3" data-wobble="0.2">
		<path id="lid_l" d="M -48 -17 C -42 -23, -30 -24, -18 -17"/>
		<path id="lid_r" d="M 14 -17 C 22 -24, 36 -24, 46 -18"/>
	</g>
	<g stroke-width="1.1" opacity="0.7" data-taper="0.3,0.3" data-wobble="0.2">
		<path id="low_l" d="M -43 -13 C -36 -10, -27 -10, -21 -13"/>
	</g>
	<path id="iris_l" fill="ink" fill-opacity="0.95" opacity="1" d="M -36 -19 C -33 -22, -28 -22, -26 -19 C -28 -15, -33 -15, -36 -19 Z"/>
	<path id="iris_r" fill="ink" fill-opacity="0.95" opacity="1" d="M 22 -19 C 25 -22, 30 -22, 32 -19 C 30 -15, 25 -15, 22 -19 Z"/>
	<!-- round 2: the eyes read at range: a painted eye white under each lid (a warm grey, never white), the iris a dark amber, a catchlight above the lighting -->
	<path id="white_l" fill="ink" data-paint="#cfc3ad" opacity="1" d="M -45 -17.4 C -40 -22, -30 -22.6, -21 -17.4 C -27 -13.4, -37 -13.4, -45 -17.4 Z"/>
	<path id="white_r" fill="ink" data-paint="#cfc3ad" opacity="1" d="M 16 -17.4 C 22 -22.6, 34 -22, 44 -18 C 36 -13.4, 24 -13.4, 16 -17.4 Z"/>
	<path id="iris_paint_l" fill="ink" data-paint="#4a2a16" opacity="1" d="M -37 -19 C -34 -22.4, -28 -22.4, -25 -19 C -28 -14.6, -34 -14.6, -37 -19 Z"/>
	<path id="iris_paint_r" fill="ink" data-paint="#4a2a16" opacity="1" d="M 21 -19 C 24 -22.4, 31 -22.4, 33 -19 C 31 -14.6, 24 -14.6, 21 -19 Z"/>
	<path id="catch_l" fill="ink" data-channel="catch" opacity="1" d="M -33.6 -21.4 C -32.2 -22.6, -30.6 -22.2, -30.4 -20.6 C -31.6 -19.6, -33.4 -19.8, -33.6 -21.4 Z"/>
	<path id="catch_r" fill="ink" data-channel="catch" opacity="1" d="M 24.4 -21.4 C 25.8 -22.6, 27.4 -22.2, 27.6 -20.6 C 26.4 -19.6, 24.6 -19.8, 24.4 -21.4 Z"/>
	<!-- R4-ART: designed shadow shapes (a few flat tones, never a gradient): the brow's sockets, the nose's far side, the cheekbone's crescent and the jaw, on the side away from the key -->
	<path id="socket_l" fill="ink" fill-opacity="0.3" opacity="1" d="M -50 -24 C -40 -30, -28 -30, -16 -22 C -26 -18, -40 -16, -50 -17 Z"/>
	<path id="socket_r" fill="ink" fill-opacity="0.38" opacity="1" d="M 12 -23 C 24 -30, 38 -30, 50 -24 C 42 -17, 28 -17, 12 -20 Z"/>
	<path id="shadow_nose" fill="ink" fill-opacity="0.3" opacity="1" d="M 9 -22 C 14 -8, 18 4, 19 14 C 14 6, 10 -6, 7 -18 Z"/>
	<path id="shadow_cheek" fill="ink" fill-opacity="0.32" opacity="1" d="M 30 8 C 46 14, 52 34, 48 58 C 44 42, 38 24, 28 12 Z"/>
	<path id="shadow_jaw" fill="ink" fill-opacity="0.3" opacity="1" d="M 24 64 C 36 76, 38 90, 26 102 C 30 88, 28 74, 18 66 Z"/>
	<!-- the nose: the two lines of the bridge, the wings, the nostrils, the shadow under the tip -->
	<g stroke-width="1.3" opacity="0.8" data-taper="0.25,0.25" data-wobble="0.3">
		<path id="bridge_l" d="M -9 -24 C -11 -12, -12 2, -17 14"/>
		<path id="wing_l" d="M -27 12 C -29 21, -20 29, -9 28"/>
	</g>
	<path id="nostril_l" fill="ink" fill-opacity="0.95" opacity="1" d="M -13 25 C -10 27, -6 27, -4 25 C -7 23, -11 23, -13 25 Z"/>
	<path id="nostril_r" fill="ink" fill-opacity="0.95" opacity="1" d="M 4 25 C 6 27, 10 27, 13 25 C 11 23, 7 23, 4 25 Z"/>
	<!-- the mouth and its folds -->
	<g stroke-width="2.2" opacity="0.95" data-taper="0.1,0.12" data-wobble="0.3">
		<path id="mouth" d="M -26 60 C -17 56, -8 59, 0 61 C 9 60, 17 56, 27 59"/>
	</g>
	<g stroke-width="1.1" opacity="0.65" data-taper="0.3,0.3" data-wobble="0.3">
		<path id="fold_l" d="M -30 30 C -37 42, -38 54, -33 66"/>
	</g>
	<!-- R4-ART: no stubble strokes here: the hatching is baked in the shade map and follows the form -->
	<g stroke-width="0.95" opacity="0.55" data-taper="0.35,0.4" data-wobble="0.25">
	</g>
</g>
</svg>
