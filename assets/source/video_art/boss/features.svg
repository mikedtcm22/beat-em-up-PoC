	<path id="nostril_r" fill="ink" fill-opacity="0.95" opacity="1" d="M 4 25 C 6 27, 10 27, 13 25 C 11 23, 7 23, 4 25 Z"/>
	<path id="nose_shadow" stroke-width="1.5" opacity="0.7" data-taper="0.3,0.3" d="M -9 32 C -4 35, 4 35, 9 32"/>
	<!-- the mouth and its folds -->
	<g stroke-width="2.2" opacity="0.95" data-taper="0.1,0.12" data-wobble="0.3">
		<path id="mouth" d="M -26 60 C -17 56, -8 59, 0 61 C 9 60, 17 56, 27 59"/>
	</g>
	<g stroke-width="1.1" opacity="0.65" data-taper="0.3,0.3" data-wobble="0.3">
