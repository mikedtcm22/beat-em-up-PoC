<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -170 300 340">
<!-- Ox's bold face (M7 e-ox): millimetres over the head's front view, origin (0, 1.671 m), x to the viewer's right, y down. Heavy brows on the band's
     lower edge, narrow eye slits, a nose side line with its hook, a set mouth, a jaw line. Lines go into the ink only; his colours are the M6 palette's. -->
<g data-view="front" data-origin="0 1.671" data-px="4">
	<g stroke-width="6.5" opacity="1.0" data-taper="0.05,0.35" data-wobble="0">
		<path id="brow_l" d="M -64 38 C -50 38, -34 42, -14 50"/>
		<path id="brow_r" d="M 64 36 C 50 36, 34 40, 14 48"/>
	</g>
	<g stroke-width="3.4" opacity="1.0" data-taper="0.2,0.2" data-wobble="0">
		<path id="eye_l" d="M -52 56 L -22 61"/>
		<path id="eye_r" d="M 22 60 L 52 55"/>
	</g>
	<g stroke-width="3.2" opacity="1.0" data-taper="0.1,0.3" data-wobble="0">
		<path id="nose_side" d="M -10 56 C -16 68, -20 80, -16 90"/>
		<path id="nose_base_r" d="M 5 93 C 9 96, 15 96, 19 91"/>
		<path id="nose_base" d="M -19 93 C -14 97, -7 97, -3 93"/>
	</g>
	<g stroke-width="4.4" opacity="1.0" data-taper="0.15,0.15" data-wobble="0">
		<path id="mouth" d="M -34 120 C -12 122, 12 122, 34 120"/>
	</g>
	<g stroke-width="2.6" opacity="1.0" data-taper="0.1,0.1" data-wobble="0">
		<path id="mouth_l" d="M -36 113 L -33 123"/>
		<path id="mouth_r" d="M 36 113 L 33 123"/>
	</g>
</g>
</svg>
