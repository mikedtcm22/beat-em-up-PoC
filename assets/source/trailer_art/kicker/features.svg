<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -150 280 300">
<!-- The trailer Kicker (M7 e-kicker, bolder at x-chars): the masked face over the head's front sheet (centre -0.003 / 1.675 m). Millimetres, x to the viewer's right, y down.
