<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -150 280 300">
<!-- The trailer Punk arm B head: arm A's drawing (assets/source/trailer_art/punk/features.svg) re-registered on the Tripo T13 mesh (centre 0.0 / 1.68 m). Millimetres, x to the viewer's right, y down. See tools/pipeline/trailer_features.py. -->
<g data-view="front" data-origin="0.0 1.68" data-px="4">
	<!-- cap: panel seams from the button, the patch, the sweat band along the bottom edge -->
	<g stroke-width="2.6" opacity="0.95" data-taper="0.1,0.25" data-wobble="0.5">
		<path id="seam_1" d="M -4 -142 C -14 -110, -28 -70, -36 -22"/>
		<path id="seam_2" d="M 6 -142 C 24 -110, 46 -70, 66 -26"/>
		<path id="seam_3" d="M -2 -144 C -40 -118, -78 -80, -104 -28"/>
		<path id="seam_4" d="M 8 -144 C 50 -120, 90 -86, 112 -40"/>
	</g>
	<g stroke-width="3.2" opacity="0.95" data-taper="0.1,0.2" data-wobble="0.4">
		<path id="band" d="M -112 -2 C -70 6, -30 8, 10 8 C 50 8, 90 4, 118 -4"/>
		<path id="patch" d="M -16 -62 C 0 -66, 40 -66, 56 -58 C 58 -42, 52 -28, 38 -24 C 14 -22, -8 -26, -16 -38 Z"/>
	</g>
	<!-- heavy brows, slanting down to the nose -->
	<g stroke-width="6.5" opacity="0.95" data-taper="0.08,0.45" data-wobble="0.3">
		<path id="brow_l" d="M -74 17 C -58 13, -32 17, -10 31"/>
		<path id="brow_r" d="M 74 17 C 58 13, 32 17, 10 31"/>
	</g>
