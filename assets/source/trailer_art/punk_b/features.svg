	<path id="eye_l_white" fill="ink" data-paint="#ccd4e8" opacity="0.92" d="M -64 51 C -54 42, -30 42, -20 51 C -30 57, -54 58, -64 51 Z"/>
	<path id="eye_r_white" fill="ink" data-paint="#ccd4e8" opacity="0.92" d="M 64 51 C 54 42, 30 42, 20 51 C 30 57, 54 58, 64 51 Z"/>
	<path id="iris_l" fill="ink" opacity="0.95" d="M -45 44 C -39 43, -33 46, -33 51 C -34 55, -40 57, -45 55 C -49 52, -49 47, -45 44 Z"/>
	<path id="iris_r" fill="ink" opacity="0.95" d="M 33 44 C 39 43, 45 46, 45 51 C 44 55, 38 57, 33 55 C 29 52, 29 47, 33 44 Z"/>
	<g stroke-width="3.2" opacity="0.95" data-taper="0.1,0.2" data-wobble="0.2">
		<path id="lid_l" d="M -66 51 C -56 39, -30 39, -17 51"/>
		<path id="lid_r" d="M 66 51 C 56 39, 30 39, 17 51"/>
	</g>
	<g stroke-width="1.3" opacity="0.65" data-taper="0.25,0.3" data-wobble="0.3">
		<path id="bag_l" d="M -62 60 C -50 66, -32 66, -22 60"/>
		<path id="bag_r" d="M 62 60 C 50 66, 32 66, 22 60"/>
		<path id="lower_l" d="M -58 57 C -46 60, -30 60, -22 56"/>
		<path id="lower_r" d="M 58 57 C 46 60, 30 60, 22 56"/>
	</g>
	<!-- nose line, base and nostrils -->
	<g stroke-width="2.0" opacity="0.8" data-taper="0.2,0.3" data-wobble="0.3">
		<path id="nose_l" d="M -9 50 C -12 68, -14 82, -22 94"/>
		<path id="nose_r" d="M 9 52 C 12 68, 14 82, 22 93"/>
		<path id="nose_base" d="M -22 98 C -10 105, 10 105, 22 98"/>
	</g>
	<path id="nostril_l" fill="ink" opacity="0.8" d="M -17 99 C -13 97, -9 98, -8 101 C -11 103, -15 103, -17 99 Z"/>
	<path id="nostril_r" fill="ink" opacity="0.8" d="M 17 99 C 13 97, 9 98, 8 101 C 11 103, 15 103, 17 99 Z"/>
	<!-- cheek lines, the set mouth, the chin -->
	<g stroke-width="1.5" opacity="0.7" data-taper="0.25,0.35" data-wobble="0.35">
		<path id="cheek_l" d="M -40 100 C -50 110, -52 124, -45 138"/>
		<path id="cheek_r" d="M 40 100 C 50 110, 52 124, 45 138"/>
		<path id="chin" d="M -14 140 C -4 145, 6 145, 14 140"/>
	</g>
	<g stroke-width="3.2" opacity="0.95" data-taper="0.1,0.1" data-wobble="0.25">
		<path id="mouth" d="M -36 122 C -18 118, 18 118, 36 122"/>
	</g>
	<g stroke-width="1.8" opacity="0.8" data-taper="0.1,0.5" data-wobble="0.2">
		<path id="corner_l" d="M -36 122 C -40 125, -42 131, -40 136"/>
		<path id="corner_r" d="M 36 122 C 40 125, 42 131, 40 136"/>
	</g>
	<g stroke-width="1.2" opacity="0.5" data-taper="0.3,0.3" data-wobble="0.2">
		<path id="lip" d="M -20 131 C -8 134, 8 134, 20 131"/>
	</g>
	<!-- the jaw's shadow: the dark under the chin on the neck -->
	<path id="jaw_shadow" fill="ink" fill-opacity="0.5" opacity="1" d="M -84 142 C -62 166, 62 166, 84 142 C 52 156, -52 156, -84 142 Z"/>
</g>
<g data-view="back" data-origin="0.0 1.68" data-px="4">
	<g stroke-width="1.5" opacity="0.8" data-taper="0.15,0.3" data-wobble="0.5">
		<path id="bseam_1" d="M 0 -142 C 2 -110, 2 -70, 0 -20"/>
		<path id="bseam_2" d="M -2 -140 C -40 -112, -70 -70, -92 -24"/>
		<path id="bseam_3" d="M 2 -140 C 40 -112, 70 -70, 92 -24"/>
	</g>
	<g stroke-width="1.2" opacity="0.6" data-taper="0.1,0.2" data-wobble="0.4">
		<path id="bband" d="M -100 -4 C -60 6, 60 6, 100 -4"/>
	</g>
</g>
</svg>
